# Source-tree checks for the authoring branches (source/*, ws/*). Builds the site from this
# tree, runs every local QA layer against the output, validates HTML, scans for secrets and
# reports how far the build has drifted from what is live on `main`. Nothing is deployed.
name: source-checks

on:
  pull_request:
    # Authoring branches only: this workflow must never run against (or gate) PRs into `main`,
    # which GitHub Pages serves as-is and which has its own site-checks.yml.
    branches: ['ws/**', 'source/**']
  push:
    branches: ['ws/**', 'source/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  SYNTHETIC_ENDPOINT: https://script.google.com/macros/s/AKfycbxSyntheticQuoteQa000000000000000000000000/exec

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: "Check out (full history: drift reference and secret-scan range)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies (hash-checked)
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/ci/requirements.txt
          python -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/ci/requirements-build.txt
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --no-build-isolation -r .github/ci/requirements-html.txt
          python - <<'PY'
          import hashlib, os, sys, vnujar
          jar = os.path.join(os.path.dirname(vnujar.__file__), 'vnu.jar')
          got = hashlib.sha256(open(jar, 'rb').read()).hexdigest()
          want = '8369c533e79495a78b2ec5b5378c07213dc2cb87b21159ab4850d0ed97a09f79'  # VNU_JAR_SHA256, html5validator 0.4.2
          print('vnu.jar sha256', got)
          sys.exit(0 if got == want else 'vnu.jar sha256 mismatch: expected ' + want)
          PY

      - name: Unit tests — CI tooling
        run: |
          python -B .github/ci/test_drift_report.py
          (cd quote-form && python -B -m unittest tests.test_endpoint)

      - name: Unit tests — quote form (node, standard library only)
        working-directory: quote-form
        run: |
          node tests/test_regions.js
          node tests/test_local.js
          node tests/test_manifest.js
          node tests/test_owner_qa.js

      - name: Build (fixture mode, synthetic endpoint) — runs qa_static and the production contract
        run: |
          python -B build_site.py --output "$RUNNER_TEMP/site-fixture" --mode fixture --quote-endpoint "$SYNTHETIC_ENDPOINT" > "$RUNNER_TEMP/build-fixture.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/build-fixture.json')); print(d['original_static_qa']); print('clean_url_qa:', d['clean_url_qa'])"

      - name: Reference tree from main (what is live) and its reviewed quote endpoint
        id: main
        run: |
          mkdir -p "$RUNNER_TEMP/main"
          git archive origin/main | tar -x -C "$RUNNER_TEMP/main"
          endpoint="$(grep -o 'https://script.google.com/macros/s/[A-Za-z0-9_-]*/exec' "$RUNNER_TEMP/main/request-a-quote.html" | head -1)"
          test -n "$endpoint"
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          echo "main=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Build (production mode, live endpoint from main) — protected pins must hold
        run: |
          python -B build_site.py --output "$RUNNER_TEMP/site-production" --quote-endpoint "${{ steps.main.outputs.endpoint }}" > "$RUNNER_TEMP/build-production.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/build-production.json')); print(d['original_static_qa'])"

      - name: Output checks from main (site_checks + qa_post) — REPORT ONLY until the source catches up with main
        continue-on-error: true
        run: |
          set +e
          python -B .github/ci/site_checks.py "$RUNNER_TEMP/site-production" | tee "$RUNNER_TEMP/site_checks.txt"
          python -B .github/ci/qa_post.py "$RUNNER_TEMP/site-production" | tee -a "$RUNNER_TEMP/site_checks.txt"
          {
            echo "## main's output checks on the source build (report only)"
            echo
            echo "Known gap: the source tree predates main's brand/stub rules (see CONSOLIDATION.md)."
            echo
            echo '```'
            grep -E '^(site_checks|qa_post) ' "$RUNNER_TEMP/site_checks.txt" || true
            grep '^FAIL' "$RUNNER_TEMP/site_checks.txt" | sed -E "s/^FAIL: [^:]+: //; s/'[^']*'/X/g" | sort | uniq -c | sort -rn | head -10
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: HTML validation (W3C Nu validator) on the production build
        run: html5validator --root "$RUNNER_TEMP/site-production" --match '*.html' --log INFO

      - name: Drift report — production build vs main
        run: |
          python -B .github/ci/drift_report.py --built "$RUNNER_TEMP/site-production" --reference "$RUNNER_TEMP/main" \
            --ignore .git,.github --markdown "$RUNNER_TEMP/drift.md" --json "$RUNNER_TEMP/drift.json"
          { echo; echo "Reference: main @ ${{ steps.main.outputs.main }}"; echo; cat "$RUNNER_TEMP/drift.md"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Secret scan (gitleaks, pinned + checksum verified)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            bash .github/ci/gitleaks.sh . --log-opts="$BASE_SHA..HEAD"
          else
            bash .github/ci/gitleaks.sh .
          fi

      - name: Upload builds and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-checks-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/site-fixture
            ${{ runner.temp }}/site-production
            ${{ runner.temp }}/build-fixture.json
            ${{ runner.temp }}/build-production.json
            ${{ runner.temp }}/drift.md
            ${{ runner.temp }}/drift.json
            ${{ runner.temp }}/site_checks.txt
          retention-days: 14
          if-no-files-found: warn

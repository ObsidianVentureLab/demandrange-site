# List-pipeline checks (pipeline/): unit tests with an injected fake transport, an offline
# fixture replay through the CLI, and a secret scan. Nothing here calls Apollo or any other
# provider; no API key exists in CI. Tooling tree only (never served by GitHub Pages).
name: pipeline-tests

on:
  pull_request:
    paths:
      - 'pipeline/**'
      - '.github/workflows/pipeline-tests.yml'
      - '.github/ci/gitleaks.sh'
  push:
    branches: ['ws/**', 'source/**']

permissions:
  contents: read

concurrency:
  group: pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APOLLO_API_KEY: ''        # explicit: no keys in CI; --live cannot work here
      ZEROBOUNCE_API_KEY: ''
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Standard library only (no third-party imports in pipeline/)
        run: |
          python -c "import pipeline, pipeline.icp, pipeline.apollo, pipeline.csvsafe, pipeline.prospects, pipeline.zerobounce, pipeline.verify, pipeline.export, pipeline.clientdb, pipeline.cli; print('imports ok')"
          if grep -rnE '^\s*(import|from)\s+(requests|httpx|aiohttp|pandas|openpyxl)\b' pipeline/; then echo 'third-party import found'; exit 1; fi

      - name: Unit tests (network blocked)
        run: python -B -m unittest discover -s pipeline/tests -t . -v

      - name: CLI dry run sends nothing and writes nothing
        run: |
          python -B -m pipeline prospects --brief pipeline/examples/brief-fixture.json --out "$RUNNER_TEMP/dry" > "$RUNNER_TEMP/dry.json"
          python -c "import json,os,sys; d=json.load(open(os.environ['RUNNER_TEMP']+'/dry.json')); assert d['dry_run'] and not d['sent']; assert not os.path.exists(os.environ['RUNNER_TEMP']+'/dry'); print('dry run ok')"

      - name: CLI fixture replay (wholly fictional data)
        run: |
          python -B -m pipeline prospects --brief pipeline/examples/brief-fixture.json --out "$RUNNER_TEMP/fx" --fixture pipeline/examples/apollo-organizations-fixture.json
          python -c "import csv,os,glob; r=list(csv.DictReader(open(glob.glob(os.environ['RUNNER_TEMP']+'/fx/*.csv')[0]))); assert len(r)==5 and all(x['data_mode']=='fixture' for x in r); print('fixture replay ok', len(r))"

      - name: CLI verify (dry run writes nothing; fixture replay verifies the fictional list)
        run: |
          python -B -m pipeline verify --input pipeline/examples/emails-fixture.csv --out "$RUNNER_TEMP/vdry" > "$RUNNER_TEMP/vdry.json"
          python -c "import json,os; d=json.load(open(os.environ['RUNNER_TEMP']+'/vdry.json')); assert d['dry_run'] and d['plan']['sendable']==6; assert not os.path.exists(os.environ['RUNNER_TEMP']+'/vdry'); print('verify dry run ok')"
          python -B -m pipeline verify --input pipeline/examples/emails-fixture.csv --out "$RUNNER_TEMP/vfx" --fixture pipeline/examples/zerobounce-results-fixture.json
          python -c "import csv,os,glob; r=list(csv.DictReader(open(glob.glob(os.environ['RUNNER_TEMP']+'/vfx/*.csv')[0]))); assert len(r)==9 and sum(x['verification_decision']=='keep' for x in r)==3; print('verify fixture replay ok')"

      - name: CLI export (delivery folder from the fixture-verified list; nothing sent)
        run: |
          python -B -m pipeline export --input "$RUNNER_TEMP/vfx/emails-fixture-verified.csv" --out "$RUNNER_TEMP/deliveries" --client "Demo Client" --brief-ref DEMO-BRIEF-A-v1 --dictionary-version DEMO-DICT-v1 --export-version DEMO-EXPORT-v1 --export-id ci --include-decisions keep,review --dedupe-on work_email --xlsx > "$RUNNER_TEMP/export.json"
          python -c "import json,os,zipfile; d=json.load(open(os.environ['RUNNER_TEMP']+'/export.json')); assert d['rows_delivered']==3, d; z=zipfile.ZipFile(d['folder']+'/demo-client-ci.xlsx'); assert z.testzip() is None; print('export ok', d['files'])"

      - name: CLI db (init, import the fictional Sheet export, record the CI delivery, search)
        run: |
          DB="$RUNNER_TEMP/clientdb.sqlite"
          python -B -m pipeline db --db "$DB" init
          python -B -m pipeline db --db "$DB" import-sheet pipeline/examples/sheet-export-fixture.csv > "$RUNNER_TEMP/imp.json"
          python -B -m pipeline db --db "$DB" record-delivery "$RUNNER_TEMP/deliveries/demo-client/ci/MANIFEST.json" > "$RUNNER_TEMP/rec.json"
          python -B -m pipeline db --db "$DB" search alpha > "$RUNNER_TEMP/search.json"
          python -c "import json,os; t=os.environ['RUNNER_TEMP']; i=json.load(open(t+'/imp.json')); r=json.load(open(t+'/rec.json')); s=json.load(open(t+'/search.json')); assert i['rows_new']==3 and r['rows_delivered']==3 and len(s['clients'])==1; print('db ok')"

      - name: Secret scan (pinned gitleaks, full history of this ref)
        run: .github/ci/gitleaks.sh "$GITHUB_WORKSPACE"

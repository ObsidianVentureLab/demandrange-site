# Output-only checks for the built Demand Range site. This repo holds built output only
# (the generator and its qa_static/build checks run off-repo before each release).
# Files under .github/ are not part of the GitHub Pages deployment.
name: site-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned dependencies (hash-checked)
        run: python -m pip install --disable-pip-version-check --no-deps --require-hashes -r .github/ci/requirements.txt

      - name: Site checks (HTML, links, sitemap/llms, brand, stubs, served surface)
        run: python -B .github/ci/site_checks.py .

      - name: Strict qa_post (F15)
        run: python -B .github/ci/qa_post.py .
